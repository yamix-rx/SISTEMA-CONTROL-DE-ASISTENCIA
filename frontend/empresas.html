<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/session.css">
<script src="js/navigation.js"></script>
<script src="js/session.js"></script>
<title>SBSS - Empresas</title>
<link rel="stylesheet" href="css/estilos.css">
<script src="vendor/lucide/lucide.min.js"></script>
<style>
:root{--line:#d8e6ef;--blue:#075985;--blue2:#0b75b5}
*{box-sizing:border-box}
body{margin:0;background:#eef5f9;color:#174766;font-family:Arial,Helvetica,sans-serif}
.app{
    min-width:0;
}
.top{background:linear-gradient(105deg,#174d73,#075d91 58%,#063e65)}
.active{background:linear-gradient(180deg,#2a97dd,#147bc0)}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 5px rgba(14,65,98,.06)}
.control{height:32px;border:1px solid #cee0ea;border-radius:5px;background:#fff;padding:0 9px;font-size:11px;outline:none;width:100%}
.control:focus{border-color:#2b8ccd;box-shadow:0 0 0 2px rgba(43,140,205,.1)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{background:linear-gradient(#0d6fa9,#075b8d);color:white;font-size:10px;padding:9px 8px;text-align:left;border-right:1px solid rgba(255,255,255,.18);white-space:nowrap}
.tbl td{font-size:10px;padding:8px;color:#275675;border-right:1px solid #e1eaf0;border-bottom:1px solid #e3ecf2;white-space:nowrap}
.tbl tbody tr:hover td{background:#f7fbfe}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:9px;font-weight:700}
.ok{background:#d7f6e8;color:#19855c}
.no{background:#ffe0e3;color:#c73b49}
.toast{position:fixed;right:20px;bottom:20px;z-index:90;background:#123f5b;color:#fff;padding:11px 14px;border-radius:8px;font-size:11px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.modalbg{background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
</style>
<link rel="stylesheet" href="css/navigation.css">
</head>
<body>
<div class="app min-vh-100">
<header class="sbss-header top text-white sbss-h-54 sticky-top top-0 sbss-z-40 shadow">
  <div class="h-100 d-flex align-items-center">
    <div class="sbss-brand sbss-px-5 d-flex align-items-center gap-2 fw-bold sbss-fs-22"><span class="text-info-emphasis sbss-fs-30">✦</span>SBSS</div>
    <div class="ms-auto sbss-pe-5 d-flex gap-3 align-items-center">
      <div class="d-flex align-items-center sbss-gap-2-5 sbss-ps-3 border-start border-info border-opacity-25">
        <div id="avatarLetra" class="sbss-w-8 sbss-h-8 rounded-circle bg-info border border-info d-flex align-items-center justify-content-center sbss-fs-12 fw-bold text-white shadow-sm">U</div>
        <div class="d-flex flex-column text-start">
          <span id="nombreUsuarioSesion" class="sbss-fs-12 fw-bold text-white sbss-leading-tight">Usuario</span>
          <span id="rolUsuarioSesion" class="sbss-fs-10 text-info-emphasis fw-medium sbss-leading-tight">Rol</span>
        </div>
        <button id="btnCerrarSesion" title="Cerrar Sesión" class="text-info-emphasis sbss-hover-rose sbss-p-1-5 sbss-transition ms-1">
          <i data-lucide="log-out" class="sbss-w-4 sbss-h-4"></i>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="sbss-navigation-layout">
  <button id="btnAbrirSidebar" class="sbss-sidebar-open d-none" type="button" title="Mostrar menú lateral" aria-label="Mostrar menú lateral" aria-controls="sidebarMenu" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>

  <aside id="sidebarMenu" class="sbss-sidebar" aria-label="Menú principal"></aside>

  <main class="flex-grow-1 p-3 bg-info-subtle sbss-space-y-4 sbss-max-w-7xl mx-auto sbss-transition sbss-transition">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <h1 class="sbss-fs-18 fw-bold text-primary-emphasis">GESTIÓN DE EMPRESAS DEL HOLDING</h1>
        <p class="sbss-fs-12 text-primary-emphasis">Administre las entidades empresariales, información fiscal y estado operativo.</p>
      </div>
      <button id="btnNuevaEmpresa" class="sbss-h-9 px-3 rounded-2 bg-info sbss-hover-blue text-white sbss-fs-12 fw-bold d-flex align-items-center gap-2 shadow-sm sbss-transition">
        <i data-lucide="plus" class="sbss-w-4 sbss-h-4"></i>Nueva Empresa
      </button>
    </div>

    <section class="panel overflow-hidden">
      <div class="sbss-p-3 border-bottom border border-secondary-subtle d-flex sbss-gap-3">
        <input id="txtBuscarEmpresa" class="control sbss-max-w-sm" placeholder="Buscar por razón social o RUC...">
      </div>
      <div class="overflow-x-auto">
        <table class="tbl">
          <thead>
            <tr>
              <th>N°</th>
              <th>Logo</th>
              <th>Razón Social</th>
              <th>RUC</th>
              <th>Dirección</th>
              <th>Contacto</th>
              <th class="text-center">Personal Activo</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyEmpresas">
            <tr><td colspan="9" class="text-center py-4 text-body-secondary">Cargando empresas...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</div>

<!-- Modal Empresa -->
<div id="modalEmpresa" class="d-none position-fixed top-0 end-0 bottom-0 start-0 sbss-z-50 modalbg align-items-center justify-content-center p-3">
  <form id="formEmpresa" class="bg-white w-100 sbss-max-w-md rounded-3 shadow-lg overflow-hidden">
    <div class="bg-info text-white sbss-px-5 py-3 d-flex justify-content-between align-items-center">
      <b id="modalTitulo">Registrar Empresa</b>
      <button type="button" data-close="modalEmpresa" class="text-white sbss-hover-rose-soft-text">✕</button>
    </div>
    <div class="sbss-p-5 sbss-space-y-3 sbss-fs-12">
      <input type="hidden" id="empresaId">
      <div>
        <label class="fw-bold d-block mb-1">Razón Social *</label>
        <input id="mRazonSocial" class="control" required placeholder="Ej. Droguería Silsan">
      </div>
      <div>
        <label class="fw-bold d-block mb-1">Logo de la empresa</label>
        <input id="mLogo" type="file" class="control" accept="image/png,image/jpeg,image/webp">
        <p class="sbss-fs-10 text-body-secondary mt-1">PNG, JPG o WebP. Máximo 2 MB.</p>
        <img id="mLogoPreview" class="d-none mt-2 sbss-h-14 sbss-max-w-40 object-fit-contain rounded-1 border border-secondary-subtle bg-light p-1" alt="Vista previa del logo">
      </div>
      <div>
        <label class="fw-bold d-block mb-1">RUC (si corresponde)</label>
        <input id="mRuc" class="control" maxlength="11" pattern="[0-9]{11}" placeholder="20XXXXXXXXX">
      </div>
      <div>
        <label class="fw-bold d-block mb-1">Dirección</label>
        <input id="mDireccion" class="control" placeholder="Dirección fiscal">
      </div>
      <div class="d-grid sbss-grid-cols-2 gap-2">
        <div>
          <label class="fw-bold d-block mb-1">Teléfono</label>
          <input id="mTelefono" class="control" disabled placeholder="No disponible">
        </div>
        <div>
          <label class="fw-bold d-block mb-1">Estado</label>
          <select id="mEstado" class="control">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>
      <div>
        <label class="fw-bold d-block mb-1">Correo de Contacto</label>
        <input id="mEmail" type="email" class="control" disabled placeholder="No disponible">
      </div>
    </div>
    <div class="sbss-px-5 sbss-pb-5 d-flex justify-content-end gap-2">
      <button type="button" data-close="modalEmpresa" class="border rounded-1 px-3 py-2 sbss-fs-12">Cancelar</button>
      <button type="submit" id="btnGuardarEmpresa" class="bg-info sbss-hover-blue text-white rounded-1 px-3 py-2 sbss-fs-12 fw-bold sbss-transition">Guardar</button>
    </div>
  </form>
</div>

<script src="js/sidebar.js"></script>
<script>
  const token = localStorage.getItem('sbss_token');
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let listaEmpresas = [];
  const tbodyEmpresas = document.getElementById('tbodyEmpresas');

  function toast(m) {
    let x = document.createElement('div');
    x.className = 'toast';
    x.textContent = m;
    document.body.appendChild(x);
    setTimeout(() => x.remove(), 2500);
  }

  async function cargarEmpresas() {
    try {
      const res = await fetch('/api/empresas', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      if (!data.ok) return;
      listaEmpresas = data.data || [];
      renderEmpresas(listaEmpresas);
    } catch (e) {
      console.error(e);
      tbodyEmpresas.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">Error al conectar con la base de datos</td></tr>`;
    }
  }

  function renderEmpresas(lista) {
    if (lista.length === 0) {
      tbodyEmpresas.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-body-secondary">No se encontraron empresas registradas</td></tr>`;
      return;
    }
    tbodyEmpresas.innerHTML = lista.map((e, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td>${e.logo_url ? `<img data-logo-url="${escapeHtml(e.logo_url)}" alt="Logo de ${escapeHtml(e.razon_social)}" class="sbss-h-9 sbss-w-14 object-fit-contain rounded-1 border border-secondary-subtle bg-light p-1">` : '<span class="text-body-secondary">Sin logo</span>'}</td>
        <td><strong class="text-info">${escapeHtml(e.razon_social)}</strong></td>
        <td>${escapeHtml(e.ruc || '-')}</td>
        <td>${escapeHtml(e.direccion || '-')}</td>
        <td>${escapeHtml(e.email_contacto || e.telefono || '-')}</td>
        <td class="text-center fw-bold">${Number(e.total_empleados) || 0} colaboradores</td>
        <td class="text-center">
          <span class="pill ${e.estado === 'activo' ? 'ok' : 'no'}">● ${e.estado === 'activo' ? 'Activo' : 'Inactivo'}</span>
        </td>
        <td class="text-center">
          <button class="text-info fw-bold p-1 editEmp" data-id="${Number(e.id)}" title="Editar">✎</button>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('[data-logo-url]').forEach(async image => {
      try {
        const response = await fetch(image.dataset.logoUrl, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) return;
        image.src = URL.createObjectURL(await response.blob());
      } catch (_) { /* La empresa conserva el texto alternativo si no se puede cargar. */ }
    });

    document.querySelectorAll('.editEmp').forEach(b => {
      b.onclick = () => {
        const id = b.dataset.id;
        const item = listaEmpresas.find(x => x.id == id);
        if (!item) return;
        document.getElementById('modalTitulo').textContent = 'Editar Empresa';
        document.getElementById('empresaId').value = item.id;
        document.getElementById('mRazonSocial').value = item.razon_social;
        document.getElementById('mRuc').value = item.ruc;
        document.getElementById('mDireccion').value = item.direccion || '';
        document.getElementById('mTelefono').value = item.telefono || '';
        document.getElementById('mEstado').value = item.estado || 'activo';
        document.getElementById('mEmail').value = item.email_contacto || '';
        document.getElementById('mLogo').value = '';
        const preview = document.getElementById('mLogoPreview');
        preview.src = item.logo_url || '';
        preview.classList.toggle('d-none', !item.logo_url);
        openM('modalEmpresa');
      };
    });
  }

  function openM(id) { document.getElementById(id).classList.remove('d-none'); document.getElementById(id).classList.add('d-flex'); }
  function closeM(id) { document.getElementById(id).classList.add('d-none'); document.getElementById(id).classList.remove('d-flex'); }
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeM(b.dataset.close));

  document.getElementById('btnNuevaEmpresa').onclick = () => {
    document.getElementById('modalTitulo').textContent = 'Registrar Empresa';
    document.getElementById('formEmpresa').reset();
    document.getElementById('empresaId').value = '';
    document.getElementById('mLogoPreview').classList.add('d-none');
    openM('modalEmpresa');
  };

  document.getElementById('mLogo').onchange = () => {
    const file = document.getElementById('mLogo').files[0];
    const preview = document.getElementById('mLogoPreview');
    if (!file) { preview.classList.add('d-none'); return; }
    preview.src = URL.createObjectURL(file);
    preview.classList.remove('d-none');
  };

  document.getElementById('formEmpresa').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardarEmpresa');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const payload = {
      id: document.getElementById('empresaId').value || null,
      razon_social: document.getElementById('mRazonSocial').value.trim(),
      ruc: document.getElementById('mRuc').value.trim(),
      direccion: document.getElementById('mDireccion').value.trim(),
      telefono: document.getElementById('mTelefono').value.trim(),
      estado: document.getElementById('mEstado').value,
      email_contacto: document.getElementById('mEmail').value.trim()
    };

    try {
      const res = await fetch('/api/empresas', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.mensaje || 'Error al guardar');

      const empresaId = payload.id || data.id;
      const logo = document.getElementById('mLogo').files[0];
      if (logo) {
        const logoData = new FormData();
        logoData.append('logo', logo);
        const logoRes = await fetch(`/api/empresas/${empresaId}/logo`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: logoData
        });
        const logoResult = await logoRes.json();
        if (!logoRes.ok || !logoResult.ok) throw new Error(logoResult.mensaje || 'No se pudo guardar el logo');
      }

      toast(data.mensaje);
      closeM('modalEmpresa');
      cargarEmpresas();
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }
  };

  document.getElementById('txtBuscarEmpresa').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtradas = listaEmpresas.filter(x => 
      x.razon_social.toLowerCase().includes(q) || (x.ruc && x.ruc.includes(q))
    );
    renderEmpresas(filtradas);
  });

  cargarEmpresas();
</script>
</body>
</html>
